name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Create Android project
        run: |
          APP_URL="https://dahshan65.github.io/Rewaq_Alkhatt/"
          mkdir -p android-build/app/src/main/java/com/dahshan/rewaq
          mkdir -p android-build/app/src/main/res/drawable-nodpi
          cd android-build

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RewaqAlkhatt"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.dahshan.rewaq'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.dahshan.rewaq'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:icon="@drawable/ic_launcher"
                  android:label="رواق الفن العربي"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/dahshan/rewaq/MainActivity.java <<EOF
          package com.dahshan.rewaq;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);

                  web.setWebChromeClient(new WebChromeClient());
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          if (!request.isForMainFrame()) return false;
                          Uri u = request.getUrl();
                          String host = u.getHost() == null ? "" : u.getHost();
                          if (host.equals("dahshan65.github.io")) return false;
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, u));
                          } catch (Exception e) { }
                          return true;
                      }
                  });

                  web.loadUrl("$APP_URL");
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

      - name: Create app icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-hosny-amiri
          pip install --break-system-packages pillow arabic-reshaper python-bidi
          export FONT_FILE="$(fc-match -f '%{file}' 'Amiri:bold')"
          echo "Using font: $FONT_FILE"
          python3 - <<'PY'
          import os
          from PIL import Image, ImageDraw, ImageFont
          import arabic_reshaper
          from bidi.algorithm import get_display

          S = 512
          font_file = os.environ["FONT_FILE"]
          img = Image.new("RGB", (S, S), "#1d6041")
          d = ImageDraw.Draw(img)
          d.rounded_rectangle([26, 26, S - 27, S - 27], radius=70, outline="#d9b45a", width=9)

          def fit(text, max_w, start):
              size = start
              while size > 20:
                  f = ImageFont.truetype(font_file, size)
                  if d.textlength(text, font=f) <= max_w:
                      return f
                  size -= 4
              return ImageFont.truetype(font_file, 20)

          def draw_line(text, y, color, start):
              shaped = get_display(arabic_reshaper.reshape(text))
              f = fit(shaped, 380, start)
              d.text((S // 2, y), shaped, font=f, fill=color, anchor="mm")

          draw_line("قواعد", 190, "#f1dca0", 190)
          draw_line("العربية", 335, "#ffffff", 190)

          img.save("android-build/app/src/main/res/drawable-nodpi/ic_launcher.png")
          PY

      - name: Build APK
        working-directory: android-build
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Rewaq-APK
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
