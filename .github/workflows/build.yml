name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Create Android project
        run: |
          APP_URL="https://dahshan65.github.io/Arabic1/"
          mkdir -p android-build/app/src/main/java/com/dahshan/rewaq
          mkdir -p android-build/app/src/main/res/drawable-nodpi
          cd android-build

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RewaqAlkhatt"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.dahshan.rewaq'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.dahshan.rewaq'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="رواق الفن العربي"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/dahshan/rewaq/MainActivity.java <<EOF
          package com.dahshan.rewaq;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);

                  web.setWebChromeClient(new WebChromeClient());
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          if (!request.isForMainFrame()) return false;
                          Uri u = request.getUrl();
                          String host = u.getHost() == null ? "" : u.getHost();
                          if (host.equals("dahshan65.github.io")) return false;
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, u));
                          } catch (Exception e) { }
                          return true;
                      }
                  });

                  web.loadUrl("$APP_URL");
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

      - name: Create app icon
        run: |
          pip install pillow
          curl -L -f -o Amiri-Bold.ttf https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-Bold.ttf
          ls -l Amiri-Bold.ttf
          cat > make_icon.py <<'PYEOF'
          from PIL import Image, ImageDraw, ImageFont

          S = 512
          FONT = "Amiri-Bold.ttf"
          OUT = "android-build/app/src/main/res/drawable-nodpi/ic_launcher.png"
          LETTER = "\u0636"

          img = Image.new("RGB", (S, S), "#1d6041")
          d = ImageDraw.Draw(img)
          d.rounded_rectangle([24, 24, S - 25, S - 25], radius=80, outline="#d9b45a", width=10)
          d.rounded_rectangle([46, 46, S - 47, S - 47], radius=64, outline="#d9b45a", width=3)

          size = 420
          while size > 40:
              f = ImageFont.truetype(FONT, size)
              box = d.textbbox((0, 0), LETTER, font=f)
              w = box[2] - box[0]
              h = box[3] - box[1]
              if w <= 330 and h <= 330:
                  break
              size -= 6

          x = (S - w) // 2 - box[0]
          y = (S - h) // 2 - box[1]
          d.text((x, y), LETTER, font=f, fill="#f1dca0")

          img.save(OUT)
          img.save("icon-preview.png")
          print("icon saved, font size", size)
          PYEOF
          python3 make_icon.py
          test -s android-build/app/src/main/res/drawable-nodpi/ic_launcher.png

      - uses: actions/upload-artifact@v4
        with:
          name: Icon-Preview
          path: icon-preview.png

      - name: Build APK
        working-directory: android-build
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Rewaq-APK
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
